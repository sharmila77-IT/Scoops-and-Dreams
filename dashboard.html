<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoops & Dreams - Storefront</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #fff5f7 0%, #fbcfe8 100%);
            color: #1e293b; min-height: 100vh; padding: 20px; 
        }
        
        .brand-title { font-family: 'Playfair Display', serif; font-style: italic; color: #be185d; font-weight: 600; font-size: 2.3rem; letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(219, 24, 93, 0.12); position: relative; }
        .brand-title::first-letter {font-family: 'Great Vibes', cursive; font-size: 3rem;font-weight: bold;color: #db2777; padding-right: 2px; }
        .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; background: rgba(255, 255, 255, 0.7); padding: 15px 25px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 15px rgba(219,39,119,0.05); }
        
        .profile-btn { font-size: 0.95rem; cursor: pointer; color: #d2447f; padding: 8px 18px; border-radius: 20px; background: rgba(255, 255, 255, 0.8); user-select: none; font-weight: 600;  border: 1px solid #fbcfe8; box-shadow: 0 2px 8px rgba(219,39,119,0.05); transition: all 0.2s ease-in-out; }
        .profile-btn:hover { background: #e25b94; color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(219,39,119,0.2); }
       
        .sidebar {
            position: fixed; top: 0; left: -340px; width: 320px; height: 100%;
            background: white; box-shadow: 5px 0 25px rgba(0,0,0,0.1); z-index: 100;
            padding: 30px 20px 80px 20px ; transition: 0.3s ease; overflow-y: auto; border-right: 1px solid #fbcfe8;
        }
        .sidebar.active { left: 0; }
        .sidebar h3 { color: #be185d; margin-bottom: 20px; border-bottom: 2px solid #fbcfe8; padding-bottom: 8px; }
        .info-item { margin-bottom: 12px; text-align: left; }
        .info-item label { display: block; font-size: 0.75rem; color: #db2777; font-weight: 600; text-transform: uppercase; margin-bottom: 2px; }
        .edit-input { width: 100%; padding: 10px; border: 1px solid #fbcfe8; border-radius: 8px; outline: none; background: #fff5f7; font-size: 0.9rem; color: #1e293b; }
        .edit-input:focus { border-color: #ec4899; background: white; }
        .edit-input:hover { background: #c5bcc0; color: white; transform: scale(1.02); }
       
        .disabled-input { background: #f1f5f9; color: #64748b; cursor: not-allowed; }
        .disabled-input:hover { background: #f1f5f9; border-color: #fbcfe8; color: #64748b; }
      
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #94a3b8; transition: all 0.3s ease-in-out; }
        .close-btn:hover { animation: glowClose 0.8s ease-in-out infinite;  cursor: pointer; background: rgba(219,39,119,0.1); border-radius: 50%; padding: 2px 6px; }

        .sidebar-btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; border: none; }
        .save-btn { background: #be185d; color: white; }
        .save-btn:hover { background: #c81d83; color: white; transform: scale(1.02); }
     
        .logout-btn { background:  #be185d; color: white; position: absolute;  bottom: 25px; left: 20px;width: calc(100% - 40px); padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;  border: none; transition: all 0.2s ease-in-out;}
        .logout-btn:hover { background: #c81d83; color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(200, 29, 131, 0.25);}

        .controls-row { display: flex; gap: 15px; align-items: center; background: rgba(255, 255, 255, 0.6); padding: 15px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); margin-bottom: 30px; box-shadow: 0 4px 15px rgba(219,39,119,0.05);}
        .search-box { flex: 2; padding: 12px 15px; border: 1px solid #fbcfe8; border-radius: 10px; outline: none; font-size: 0.95rem; background: white; color: #1e293b; transition: all 0.3s ease-in-out;}
        .search-box:focus {  border-color: #be185d; box-shadow: 0 0 12px rgba(219, 39, 119, 0.2); transform: scale(1.01); background-color: #fffdfd; }
        .search-box::placeholder { color: #94a3b8;  opacity: 1; font-size: 0.95rem; font-weight: 400;}
        .search-box::-webkit-input-placeholder { color: #1e293b; opacity: 1; }
        .search-box::-moz-placeholder { color: #1e293b; opacity: 1; }
        .search-box:-ms-input-placeholder { color: #1e293b; opacity: 1; }
        .search-box:hover {  background-color: #fff5f7; cursor: pointer; }
        .select-filter { flex: 1; padding: 12px; border: 1px solid #fbcfe8; border-radius: 10px; outline: none; background: white; font-size: 0.95rem; color: #1e293b; cursor: pointer;transition: all 0.3s ease-in-out; }
        .select-filter:hover {background-color: #fff5f7; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(219, 39, 119, 0.1);}
        .select-filter:focus { border-color: #be185d;  box-shadow: 0 0 12px rgba(219, 39, 119, 0.25);  transform: scale(1.02);  background-color: #fffdfd;}

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; margin-bottom: 50px; }
        .item-card { background: rgba(255, 255, 255, 0.85); border-radius: 20px; padding: 18px; text-align: center; box-shadow: 0 6px 18px rgba(219,39,119,0.05); border: 1px solid rgba(255,255,255,0.6); backdrop-filter: blur(5px); cursor: pointer; transition: 0.2s;}
        .item-card:hover {  background: #ed59a3; color: white;  transform: translateY(-5px) scale(1.02);  box-shadow: 0 12px 25px rgba(219, 39, 119, 0.15); border-color: #fbcfe8; }
        .item-img { width: 100%; height: 170px; object-fit: cover; border-radius: 14px; margin-bottom: 12px; }
        .item-name { font-weight: 600; color: #1e293b; font-size: 1.05rem; }
        .item-meta { font-size: 0.8rem; margin: 4px 0 10px 0; background: #fff1f2; display: inline-block; padding: 2px 12px; border-radius: 20px; color: #db2777; font-weight: 500; }
        .item-price { color: #be185d; font-weight: 700; font-size: 1.25rem; }

        .end-notice { text-align: center; color: #be185d;font-size: 1.1rem; margin: 50px auto 30px auto; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;  position: relative; display: flex; align-items: center; justify-content: center; gap: 15px; max-width: 500px;   }
        .end-notice::before,
        .end-notice::after { content: ""; flex: 1;  height: 1px;background: linear-gradient(to right, rgba(219,39,119,0), rgba(219,39,119,0.4)); }
        .end-notice::after { background: linear-gradient(to left, rgba(219,39,119,0), rgba(219,39,119,0.4));}

        .footer-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; flex-wrap: wrap; }
        .footer-links a { color: #be185d; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        .footer-links a:hover { color: #db2777; text-decoration: underline; }

        .social-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .social-links a { color: #be185d; text-decoration: none; transition: transform 0.2s, background-color 0.2s; background: rgba(255,255,255,0.7); border: 1px solid #fbcfe8; width: 45px;  height: 45px; display: flex; align-items: center;  justify-content: center;  border-radius: 50%;  overflow: hidden; }
        .social-links a:hover { transform: scale(1.1); background: #fff1f2; color: #db2777; }
        .social-links a img {width: 22px; height: 22px; object-fit: contain; }

    </style>
</head>
<body>

    <div class="sidebar" id="userSidebar">
        <div class="close-btn" onclick="toggleSidebar()">×</div>
        <h3>Profile Settings</h3>
        
        <div class="info-item"><label>Customer Name</label><input type="text" id="sbName" class="edit-input"></div>
        <div class="info-item">
            <label>Email Address</label>
            <input type="text" id="sbEmail" class="edit-input disabled-input" readonly>
        </div>
        <div class="info-item"><label>Delivery Address</label><input type="text" id="sbAddress" class="edit-input" placeholder="Flat No, Building Name"></div>
        <div class="info-item"><label>Landmark/Location</label><input type="text" id="sbLocation" class="edit-input" placeholder="Near Central Park"></div>
        <div class="info-item"><label>City</label><input type="text" id="sbCity" class="edit-input" placeholder="Coimbatore"></div>
        
        <button class="sidebar-btn save-btn" onclick="saveProfileChanges()">Update Information</button>
        <button class="sidebar-btn logout-btn" onclick="logOut()"> Log Out</button>
    </div>

    <div class="header-row">
        <div class="profile-btn" onclick="toggleSidebar()">👤 Profile</div>
        <div class="brand-title">Scoops & Dreams</div>
        <div style="width:90px;"></div>
    </div>

    <div class="controls-row">
        <input type="text" id="searchBar" class="search-box" placeholder="🔍 Search flavors or variety types..." onkeyup="runFilters()">
        
        <select id="categoryFilter" class="select-filter" onchange="runFilters()">
            <option value="all">All Specialties</option>
            <option value="Cup Ice Cream">Cup Ice Cream</option>
            <option value="Chocobar">Chocobar</option>
            <option value="Cone Ice Cream">Cone Ice Cream</option>
            <option value="Soft Serve">Soft Serve</option>
            <option value="Kulfi">Kulfi</option>
            <option value="Frozen Yogurt">Frozen Yogurt</option>
            <option value="Rolled Ice Cream">Rolled Ice Cream</option>
            <option value="Snow Cream">Snow Cream</option>
        </select>

        <select id="priceFilter" class="select-filter" onchange="runFilters()">
            <option value="all">All Budgets</option>
            <option value="50">Under ₹50</option>
            <option value="75">Under ₹75</option>
            <option value="120">Under ₹120</option>
            <option value="200">Under ₹200</option>
        </select>
    </div>

    <div class="grid-container" id="productGrid"></div>

    <hr style="border: 0; height: 1px; background: rgba(219,39,119,0.2); margin-top: 50px;">
    <div class="end-notice">You've reached the end of the list</div>
    
    <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Careers</a>
        <a href="#">Support</a>
    </div>

    <div class="social-links">
    <a href="https://instagram.com" target="_blank" title="Instagram">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
    </a>
    
    <a href="https://facebook.com" target="_blank" title="Facebook">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="Facebook">
    </a>
</div>

    <script>
        const storedName = localStorage.getItem('userName');
        const storedEmail = localStorage.getItem('userEmail');
        const storedAddress = localStorage.getItem('userAddress');
        const storedLocation = localStorage.getItem('userLocation');
        const storedCity = localStorage.getItem('userCity');

        if (storedName) document.getElementById('sbName').value = storedName;
        if (storedEmail) document.getElementById('sbEmail').value = storedEmail;
        if (storedAddress) document.getElementById('sbAddress').value = storedAddress;
        if (storedLocation) document.getElementById('sbLocation').value = storedLocation;
        if (storedCity) document.getElementById('sbCity').value = storedCity;

        function toggleSidebar() { document.getElementById('userSidebar').classList.toggle('active'); }
        
        function saveProfileChanges() {
            localStorage.setItem('userName', document.getElementById('sbName').value);
            localStorage.setItem('userAddress', document.getElementById('sbAddress').value);
            localStorage.setItem('userLocation', document.getElementById('sbLocation').value);
            localStorage.setItem('userCity', document.getElementById('sbCity').value);
            alert('Profile configuration updated successfully! ✨');
            toggleSidebar();
        }

        function logOut() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        const itemsData = [
            { id: 1, name: "Premium Strawberry", flavor: "Strawberry Ice Cream", type: "Cup Ice Cream", price: 45, img: "https://images.unsplash.com/photo-1567206563064-6f60f40a2b57?w=500&q=80" },
            { id: 2, name: "Belgian Choco Chip", flavor: "Chocolate Chip", type: "Chocobar", price: 65, img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500&q=80" },
            { id: 3, name: "Texas Roasted Pecan", flavor: "Butter Pecan", type: "Cone Ice Cream", price: 110, img: "https://www.splenda.com/wp-content/themes/bistrotheme/assets/recipe-images/spicy-texas-pecans.jpg" },
            { id: 4, name: "Kyoto Matcha Cream", flavor: "Matcha", type: "Soft Serve", price: 135, img: "https://s3-media0.fl.yelpcdn.com/bphoto/bs32FQsQCI_xc6OGT9ywxQ/348s.jpg" },
            { id: 5, name: "Vibrant Teaberry", flavor: "Teaberry", type: "Cup Ice Cream", price: 95, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRy0ybRLvdiScZpRmk2JyPRNqYHwxXMRKFmCw&s" },
            { id: 6, name: "Traditional Shahi Kulfi", flavor: "Kulfi", type: "Kulfi", price: 35, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSFfdKyXEowMKY8x4kty2g2UMJkXfkg9JsbuQ&s" },
            { id: 7, name: "Wildberry Frozen Yogurt", flavor: "Frozen Yogurt", type: "Frozen Yogurt", price: 150, img: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500&q=80" },
            { id: 8, name: "Philadelphia Vanilla", flavor: "Philadelphia Ice Cream.", type: "Cone Ice Cream", price: 55, img: "https://images.unsplash.com/photo-1570145820259-b5b80c5c8bd6?w=500&q=80" },
            { id: 9, name: "Thai Mango Rolled", flavor: "Rolled Ice Cream", type: "Rolled Ice Cream", price: 125, img: "https://images.unsplash.com/photo-1549395156-e0c1fe6fc7a5?w=500&q=80" },
            { id: 10, name: "Fairy Floss Snow", flavor: "Snow Cream", type: "Snow Cream", price: 180, img: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500&q=80" }    
             
        ];

        function renderGrid(items) {
            const container = document.getElementById('productGrid');
            container.innerHTML = '';
            if(items.length === 0) {
                container.innerHTML = `<p style="color:#64748b; text-align:center; grid-column: 1/-1; padding: 20px;">No match found for filters.</p>`;
                return;
            }
            items.forEach(p => {
                container.innerHTML += `
                    <div class="item-card" onclick="goToDetails(${p.id})">
                        <img src="${p.img}" class="item-img" onerror="this.src='https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=500&q=80'">
                        <div class="item-name">${p.name}</div>
                        <div class="item-meta">${p.type}</div>
                        <div class="item-price">₹${p.price}</div>
                    </div>
                `;
            });
        }

        function runFilters() {
            const searchVal = document.getElementById('searchBar').value.toLowerCase();
            const catVal = document.getElementById('categoryFilter').value;
            const priceVal = document.getElementById('priceFilter').value;

            const filtered = itemsData.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchVal) || p.flavor.toLowerCase().includes(searchVal);
                const matchCat = catVal === 'all' || p.type === catVal;
                const matchPrice = priceVal === 'all' || p.price <= parseInt(priceVal);
                return matchSearch && matchCat && matchPrice;
            });
            renderGrid(filtered);
        }

        function goToDetails(id) {
            const chosen = itemsData.find(p => p.id === id);
            localStorage.setItem('chosenIceCream', JSON.stringify(chosen));
            window.location.href = 'details.html';
        }

        renderGrid(itemsData);
    </script>
</body>
</html>
