<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Scoops & Dreams - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(255, 241, 242, 0.3), rgba(219, 39, 119, 0.3)), 
                        url('https://images.unsplash.com/photo-1501443762994-82bd5dace89a?q=80&w=1920') no-repeat center center/cover;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(219, 39, 119, 0.15); width: 450px; padding: 35px; text-align: center;
        }
        h1 { color: #be185d; font-weight: 700; margin-bottom: 5px; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; color: #db2777; }
        .input-style {
            width: 100%; padding: 10px 14px; background: white; border: 1px solid #fbcfe8;
            border-radius: 10px; outline: none; transition: all 0.3s;
        }
        .input-style:focus { border-color: #ec4899; box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1); }
        .primary-btn {
            background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%); color: white;
            border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 600;
            cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
        .primary-btn:hover { background: #ec4899; color: white; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Scoops & Dreams</h1>
        <p>Let's get your details for delivery! 🍦</p>
        <form onsubmit="saveAndLogin(event)">
            <div class="form-group"><label>Full Name</label><input type="text" id="loginName" class="input-style" required placeholder="John Doe"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" class="input-style" required placeholder="johndoe@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" class="input-style" required placeholder="••••••••">
            </div>
           
            <button type="submit" class="primary-btn">Enter Ice Cream Paradise</button>
        </form>
    </div>
    

    <script>
        function saveAndLogin(e) {
            e.preventDefault();
            localStorage.setItem('userName', document.getElementById('loginName').value);
            localStorage.setItem('userEmail', document.getElementById('loginEmail').value);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
