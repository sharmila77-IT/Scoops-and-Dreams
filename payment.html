<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Payment Mode</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)),
                        url('https://images.unsplash.com/photo-1576506295286-5cda18df43e7?q=80&w=1920') no-repeat center center fixed/cover;
            background: linear-gradient(135deg, #fff5f7 0%, #fbcfe8 100%); 
            color: #1e293b;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .pay-card { background: rgba(255, 255, 255, 0.95); width: 420px; padding: 35px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; backdrop-filter: blur(5px); }
        h2 { color: #be185d; margin-bottom: 25px; font-weight: 700; }
        .pay-option { display: block; width: 100%; padding: 16px; margin-bottom: 14px; background: #fff1f2; border: 1px solid #fbcfe8; border-radius: 12px; font-weight: 600; text-align: left; cursor: pointer; transition: 0.2s; color: #be185d; font-size: 0.95rem; }
        .pay-option:hover { background: #ec4899; color: white; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="pay-card">
        <h2>Select Payment Mode</h2>
        <button class="pay-option" onclick="choosePay('UPI')">📱 UPI (GPay / PhonePe)</button>
        <button class="pay-option" onclick="choosePay('Credit Card')">💳 Credit Card Gateway</button>
        <button class="pay-option" onclick="choosePay('Debit Card')">💳 Debit Card Gateway</button>
        <button class="pay-option" onclick="choosePay('COD')">💵 Cash on Delivery (COD)</button>
    </div>
    <script>
        function choosePay(mode) {
            localStorage.setItem('paymentMode', mode);
            if(mode === 'COD') { window.location.href = 'confirmation.html'; } 
            else { window.location.href = 'gate.html'; }
        }
    </script>
</body>
</html>
